name: Build Openterface Tauri Windows x64

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop-tauri/**'
      - '.github/workflows/windows-tauri.yaml'
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - '.github/workflows/windows-tauri.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: desktop-tauri
        run: npm ci

      - name: Build Windows x64 installer
        working-directory: desktop-tauri
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: openterface-windows-x64-nsis
          path: desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
